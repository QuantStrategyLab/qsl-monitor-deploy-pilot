name: Azure job deployment pilot
on:
  workflow_call:
    inputs:
      fork_run:
        required: true
        type: string
      fork_pr:
        required: true
        type: string
    secrets:
      AZURE_TENANT:
        required: false
      AZURE_CLIENT:
        required: false
      AZURE_SUBSCRIPTION:
        required: false
      PILOT_RESOURCE_GROUP:
        required: false
      PILOT_JOB:
        required: false
      PILOT_PREVIOUS_IMAGE:
        required: false
      PILOT_CANDIDATE_IMAGE:
        required: false
      PILOT_EXPECTED_SUBJECT:
        required: false
permissions: {}
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/qsl-monitor-deploy-pilot' && github.ref == 'refs/heads/pilot-integrated'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: pilot
    permissions:
      id-token: write
      actions: read
      pull-requests: read
    env:
      FORK_RUN: ${{ inputs.fork_run }}
      FORK_PR: ${{ inputs.fork_pr }}
      CALLER_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      TENANT: ${{ secrets.AZURE_TENANT }}
      CLIENT: ${{ secrets.AZURE_CLIENT }}
      SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION }}
      RESOURCE_GROUP: ${{ secrets.PILOT_RESOURCE_GROUP }}
      JOB: ${{ secrets.PILOT_JOB }}
      OLD_IMAGE: ${{ secrets.PILOT_PREVIOUS_IMAGE }}
      NEW_IMAGE: ${{ secrets.PILOT_CANDIDATE_IMAGE }}
      EXPECTED_SUBJECT: ${{ secrets.PILOT_EXPECTED_SUBJECT }}
    steps:
      - name: Verify identity, deploy fixed image and roll back
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64
          import copy
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def req(url, *, headers=None, data=None, method='GET'):
              try:
                  with urlopen(Request(url, headers=headers or {}, data=data, method=method), timeout=30) as res:
                      return json.loads(res.read() or '{}')
              except HTTPError as error:
                  raise RuntimeError(f'{method} HTTP {error.code}') from None

          env = os.environ
          assert all(re.fullmatch(r'[1-9][0-9]*', env[name]) for name in ('FORK_RUN', 'FORK_PR'))
          def github(suffix):
              return req(f'https://api.github.com/repos/{env["REPO"]}/{suffix}',
                         headers={'Authorization': 'Bearer ' + env['GITHUB_TOKEN'],
                                  'Accept': 'application/vnd.github+json'})

          pr = github('pulls/' + env['FORK_PR'])
          run = github('actions/runs/' + env['FORK_RUN'])
          files = github('pulls/' + env['FORK_PR'] + '/files')
          assert pr['base']['sha'] == env['CALLER_SHA'] and pr['base']['ref'] == 'pilot-integrated'
          assert pr['head']['repo']['fork'] and pr['head']['repo']['full_name'] != env['REPO']
          assert [item['filename'] for item in files] == ['README.md']
          assert run['head_sha'] == pr['head']['sha'] and run['event'] == 'pull_request'
          assert run['path'] == '.github/workflows/fork-probe.yml' and run['conclusion'] == 'success'
          jobs = github('actions/runs/' + env['FORK_RUN'] + '/jobs')['jobs']
          job, = jobs
          assert job['name'] == 'Deny fork deployment access' and job['conclusion'] == 'success'
          assert any(step['name'] == 'Verify GitHub denies OIDC to the fork'
                     and step['conclusion'] == 'success' for step in job['steps'])
          print('fork_permission_proof=verified; run=' + env['FORK_RUN'])

          audience = 'api://AzureADTokenExchange'
          def assertion_for(aud):
              value = req(env['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&' + urlencode({'audience': aud}),
                          headers={'Authorization': 'Bearer ' + env['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})['value']
              claims = json.loads(base64.urlsafe_b64decode(value.split('.')[1] + '=='))
              assert claims['aud'] == aud and claims['sub'] == env['EXPECTED_SUBJECT']
              assert claims['event_name'] == 'workflow_dispatch' and claims['ref'] == 'refs/heads/pilot-integrated'
              return value

          endpoint = f'https://login.microsoftonline.com/{env["TENANT"]}/oauth2/v2.0/token'
          headers = {'Content-Type': 'application/x-www-form-urlencoded'}
          def exchange_data(value):
              return urlencode({'client_id': env['CLIENT'], 'scope': 'https://management.azure.com/.default',
                  'grant_type': 'client_credentials', 'client_assertion': value,
                  'client_assertion_type': 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'}).encode()

          token = req(endpoint, method='POST', headers=headers,
                      data=exchange_data(assertion_for(audience)))['access_token']
          print('pilot_oidc_exchange=accepted; reusable_workflow_pin=verified')
          wrong_audience = 'api://qsl-monitor-pilot-untrusted'
          try:
              with urlopen(Request(endpoint, headers=headers, data=exchange_data(assertion_for(wrong_audience))),
                           timeout=30):
                  raise AssertionError('Azure issued a token for an untrusted audience')
          except HTTPError as error:
              codes = json.load(error).get('error_codes', [])
              assert error.code in (400, 401) and any(code in (70021, 700212) for code in codes), (error.code, codes)
          print('azure_untrusted_audience=rejected')

          root = (f'https://management.azure.com/subscriptions/{env["SUBSCRIPTION"]}/resourceGroups/'
                  f'{env["RESOURCE_GROUP"]}/providers/Microsoft.App/jobs/{env["JOB"]}')
          def arm(suffix='', *, method='GET', body=None):
              return req(root + suffix + '?api-version=2025-01-01', method=method,
                         headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                         data=None if body is None else json.dumps(body).encode())

          def until(fetch, done, seconds):
              deadline = time.monotonic() + seconds
              while True:
                  obj = fetch()
                  if done(obj):
                      return obj
                  if time.monotonic() >= deadline:
                      raise TimeoutError('Azure readback timed out')
                  time.sleep(4)

          old, new = env['OLD_IMAGE'], env['NEW_IMAGE']
          assert old != new and old.split('@')[0] == new.split('@')[0]
          assert all(re.fullmatch(r'ghcr\.io/[a-z0-9_./-]+@sha256:[0-9a-f]{64}', image)
                     for image in (old, new))
          before = arm()
          props = before['properties']
          assert props['provisioningState'] == 'Succeeded'
          assert props['configuration']['triggerType'] == 'Manual'
          assert not before.get('identity') or before['identity'].get('type') == 'None'
          original = props['template']
          container, = original['containers']
          assert container['image'] == old and not container.get('env')
          assert not original.get('volumes') and container['command'] == ['python']

          def change(expected, target):
              current = arm()
              assert current['properties']['template']['containers'][0]['image'] == expected
              template = copy.deepcopy(original)
              template['containers'][0]['image'] = target
              arm(method='PATCH', body={'properties': {'template': template}})
              live = until(arm, lambda value: value['properties']['provisioningState'] in {'Failed', 'Canceled'}
                           or (value['properties']['provisioningState'] == 'Succeeded'
                               and value['properties']['template'] == template), 115)
              assert live['properties']['provisioningState'] == 'Succeeded'
              assert live['properties']['template'] == template
              for key in ('configuration', 'environmentId', 'workloadProfileName'):
                  assert live['properties'][key] == props[key]
              assert live.get('identity') == before.get('identity')

          def run_image(label):
              def executions():
                  return arm('/executions').get('value', [])
              seen = {row['name'] for row in executions()}
              begin = time.monotonic()
              arm('/start', method='POST')
              def result():
                  rows = [row for row in executions() if row['name'] not in seen]
                  assert len(rows) <= 1
                  return rows[0]['properties']['status'] if rows else None
              status = until(result, lambda v: v in {'Succeeded', 'Failed', 'Stopped', 'Canceled', 'Cancelled'}, 115)
              assert status == 'Succeeded'
              print(f'{label}=Succeeded; submit_to_readback_seconds={time.monotonic()-begin:.1f}')

          try:
              change(old, new)
              run_image('fixed_candidate_run')
          finally:
              live = arm()
              active = live['properties']['template']['containers'][0]['image']
              if active == new:
                  change(new, old)
                  run_image('fixed_rollback_run')
              else:
                  assert active == old
          assert arm()['properties']['template'] == original
          print('pilot_template_restored=true; trigger=Manual')
          PY
