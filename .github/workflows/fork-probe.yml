name: Verify fork deployment permissions
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  fork-token-check:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@a1bfd5205b4c99f8112338ec1ef7d26c33e692ad
    with:
      operation: fork
  try-deploy:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@a1bfd5205b4c99f8112338ec1ef7d26c33e692ad
    with:
      operation: roundtrip
