name: Verify fork deployment permissions
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  fork-token-check:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@08433f7d0669268d02dd6e1f2be646ce5d94248b
    with:
      operation: fork
  try-deploy:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@08433f7d0669268d02dd6e1f2be646ce5d94248b
    with:
      operation: roundtrip
