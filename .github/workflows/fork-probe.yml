name: Verify fork deployment permissions
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  fork-token-check:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@56cbbfc3b2d03873e2143190b5ed977943cda0ef
    with:
      operation: fork
  try-deploy:
    if: github.event.pull_request.head.repo.fork
    permissions:
      id-token: write
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@56cbbfc3b2d03873e2143190b5ed977943cda0ef
    with:
      operation: roundtrip
