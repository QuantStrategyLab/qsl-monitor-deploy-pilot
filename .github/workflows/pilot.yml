name: Run Azure deployment pilot
on:
  workflow_dispatch:
    inputs:
      fork_run:
        description: Completed fork permission run
        required: true
        type: string
      fork_pr:
        description: Pull request from the test fork
        required: true
        type: string
permissions: {}
concurrency:
  group: isolated-monitor-deployment
  cancel-in-progress: false
jobs:
  rollout:
    permissions:
      id-token: write
      actions: read
      pull-requests: read
    uses: QuantStrategyLab/qsl-monitor-deploy-pilot/.github/workflows/azure-job-deploy.yml@5f77cce04235d54c0544b62dc2c3fce671451e65
    with:
      fork_run: ${{ inputs.fork_run }}
      fork_pr: ${{ inputs.fork_pr }}
    secrets:
      AZURE_TENANT: ${{ secrets.AZURE_TENANT }}
      AZURE_CLIENT: ${{ secrets.AZURE_CLIENT }}
      AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION }}
      PILOT_RESOURCE_GROUP: ${{ secrets.PILOT_RESOURCE_GROUP }}
      PILOT_JOB: ${{ secrets.PILOT_JOB }}
      PILOT_PREVIOUS_IMAGE: ${{ secrets.PILOT_PREVIOUS_IMAGE }}
      PILOT_CANDIDATE_IMAGE: ${{ secrets.PILOT_CANDIDATE_IMAGE }}
      PILOT_EXPECTED_SUBJECT: ${{ secrets.PILOT_EXPECTED_SUBJECT }}
